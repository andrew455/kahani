<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif;background:#f6f5f1}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Kahani Hindi Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap">
<style>
/* Layout: one app shell. Top bar with tabs on wide screens, bottom tab bar on phones.
   Reader = story column + word panel (side panel on desktop, bottom sheet on phones). */
:root {
  --bg: #f2f3f7;
  --surface: #ffffff;
  --sunk: #e9ebf2;
  --ink: #191c31;
  --muted: #5d6382;
  --line: #d9dce8;
  --accent: #b86c00;
  --accent-strong: #e8961a;
  --on-accent: #1d1400;
  --new: #2a5bd0;
  --new-bg: rgba(42, 91, 208, .22);
  --new-line: rgba(42, 91, 208, .85);
  --name: #13807a;
  --l1: rgba(232, 150, 26, .62);
  --l2: rgba(232, 150, 26, .46);
  --l3: rgba(232, 150, 26, .32);
  --l4: rgba(232, 150, 26, .18);
  --l-line: rgba(196, 118, 0, .9);
  --play: rgba(42, 91, 208, .07);
  --good: #2c8556;
  --bad: #bf3f37;
  --shadow: 0 1px 2px rgba(25, 28, 49, .06), 0 6px 24px rgba(25, 28, 49, .07);
  --f-display: "Tiro Devanagari Hindi", "Noto Serif Devanagari", Georgia, serif;
  --f-body: "Mukta", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read-size: 1.5rem;
  --radius: 10px;
  /* village game */
  --gm-grass: #a8c98a; --gm-grass2: #9fc180; --gm-path: #dcc59c; --gm-water: #7db3d6; --gm-tree: #4d7d44; --gm-trunk: #7a5a3a;
  --gm-roof: #b5523b; --gm-wall: #f1e6d2; --gm-stone: #bfc2cc; --gm-rail: #5f6372; --gm-awning: #e8961a;
  --gm-label-bg: rgba(255, 255, 255, .9); --gm-label-fg: #191c31;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11131d; --surface: #191c2a; --sunk: #222638; --ink: #e7e8f1; --muted: #9a9fbc; --line: #2b3047;
    --accent: #f0a63a; --accent-strong: #f0a63a; --on-accent: #1d1400;
    --new: #7d9fff; --new-bg: rgba(110, 150, 255, .34); --new-line: rgba(150, 180, 255, .95); --name: #5fd0c6;
    --l1: rgba(240, 166, 58, .62); --l2: rgba(240, 166, 58, .46); --l3: rgba(240, 166, 58, .32); --l4: rgba(240, 166, 58, .18); --l-line: rgba(245, 180, 80, .95);
    --play: rgba(125, 159, 255, .09); --good: #5cc28b; --bad: #f07b72;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
    --gm-grass: #34513a; --gm-grass2: #304c36; --gm-path: #6b5c45; --gm-water: #2b587a; --gm-tree: #1f3b27; --gm-trunk: #4d3a28;
    --gm-roof: #843d2e; --gm-wall: #b8ad9a; --gm-stone: #4f5464; --gm-rail: #8b90a2; --gm-awning: #c47c12;
    --gm-label-bg: rgba(17, 19, 29, .85); --gm-label-fg: #e7e8f1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11131d; --surface: #191c2a; --sunk: #222638; --ink: #e7e8f1; --muted: #9a9fbc; --line: #2b3047;
  --accent: #f0a63a; --accent-strong: #f0a63a; --on-accent: #1d1400;
  --new: #7d9fff; --new-bg: rgba(110, 150, 255, .34); --new-line: rgba(150, 180, 255, .95); --name: #5fd0c6;
  --l1: rgba(240, 166, 58, .62); --l2: rgba(240, 166, 58, .46); --l3: rgba(240, 166, 58, .32); --l4: rgba(240, 166, 58, .18); --l-line: rgba(245, 180, 80, .95);
  --play: rgba(125, 159, 255, .09); --good: #5cc28b; --bad: #f07b72;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 28px rgba(0,0,0,.35);
  --gm-grass: #34513a; --gm-grass2: #304c36; --gm-path: #6b5c45; --gm-water: #2b587a; --gm-tree: #1f3b27; --gm-trunk: #4d3a28;
  --gm-roof: #843d2e; --gm-wall: #b8ad9a; --gm-stone: #4f5464; --gm-rail: #8b90a2; --gm-awning: #c47c12;
  --gm-label-bg: rgba(17, 19, 29, .85); --gm-label-fg: #e7e8f1;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--new); outline-offset: 2px; border-radius: 4px; }
.hi { font-family: var(--f-body); }
.display { font-family: var(--f-display); font-weight: 400; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.label { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-inner { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 20px; }
.brand { display: flex; align-items: baseline; gap: 8px; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.brand .display { font-size: 1.6rem; line-height: 1; }
.brand .small { color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-left: auto; }
.tab { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.tab:hover { color: var(--ink); background: var(--sunk); }
.tab[aria-current="page"] { color: var(--ink); background: var(--surface); box-shadow: var(--shadow); }
.badge { background: var(--accent-strong); color: var(--on-accent); font-size: .72rem; font-weight: 700; border-radius: 999px; padding: 0 7px; min-width: 20px; text-align: center; line-height: 1.6; }
.sync { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-state="ok"] { background: var(--good); }
.sync[data-state="busy"] { background: var(--accent-strong); }
.sync[data-state="off"] { background: var(--bad); }
.bottom { display: none; }
main { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; }
.banner { max-width: 1120px; margin: 12px auto 0; padding: 10px 14px; border-radius: var(--radius); background: var(--sunk); color: var(--muted); font-size: .9rem; margin-inline: 16px; }
@media (min-width: 1152px) { .banner { margin-inline: auto; } }

@media (max-width: 720px) {
  .tabs { display: none; }
  .top-inner { justify-content: space-between; }
  .bottom { display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); }
  .bottom .tab { flex: 1; flex-direction: column; gap: 0; padding: 6px 4px; font-size: .78rem; position: relative; }
  .bottom .tab[aria-current="page"] { box-shadow: none; background: var(--sunk); }
  .bottom .tab .ico { font-size: 1.15rem; line-height: 1.2; }
  .bottom .badge { position: absolute; top: 2px; right: calc(50% - 26px); }
  main { padding-bottom: 96px; }
}

.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.accent { background: var(--accent-strong); color: var(--on-accent); border-color: var(--accent-strong); font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; }
.btn.ghost:hover { background: var(--sunk); }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: inline-grid; place-items: center; font-size: 1rem; padding: 0; flex: none; }
.icon-btn:hover { border-color: var(--muted); }
.icon-btn.big { width: 48px; height: 48px; background: var(--ink); color: var(--bg); border-color: var(--ink); font-size: 1.1rem; }

/* ---------- library ---------- */
.stats { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-end; margin-bottom: 28px; }
.stat .num { font-size: 2.1rem; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.stat .label { margin-top: 6px; display: block; }
.stat.cta { margin-left: auto; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 0 0 12px; }
.section-h h2 { font-size: 1.05rem; margin: 0; font-weight: 600; }
.lib-tools { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.lib-tools .seg button { padding: 4px 10px; font-variant-numeric: tabular-nums; }
.lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; }
.lesson { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, transform .15s; min-width: 0; }
.lesson:hover { border-color: var(--muted); transform: translateY(-1px); }
.lesson .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.lesson .t { font-family: var(--f-display); font-size: 1.65rem; line-height: 1.2; }
.lesson .en { color: var(--muted); font-size: .95rem; }
.lesson .meta { color: var(--muted); font-size: .8rem; display: flex; gap: 10px; flex-wrap: wrap; }
.done { color: var(--good); font-weight: 600; font-size: .8rem; white-space: nowrap; }
.mix { display: block; width: 100%; height: 10px; border-radius: 99px; }
.mix i { display: block; height: 100%; border-radius: 99px; min-width: 0; }
.mix .k { background: var(--good); }
.mix .l { background: var(--accent-strong); }
.mix .n { background: var(--new); }
.mix-legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: .82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.mix-legend span { display: inline-flex; align-items: center; gap: 5px; }
.mix-legend span::before { content: ""; width: 9px; height: 9px; border-radius: 50%; }
.mix-legend .ln::before { background: var(--new); }
.mix-legend .ll::before { background: var(--accent-strong); }
.mix-legend .lk::before { background: var(--good); }
.mix-legend b { font-weight: 600; color: var(--ink); }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 28px; color: var(--muted); max-width: 60ch; }
.empty h3 { color: var(--ink); margin: 0 0 6px; font-size: 1.05rem; }

/* ---------- reader ---------- */
.reader-bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.reader-bar .title { min-width: 0; flex: 1; }
.reader-bar .title .display { font-size: 1.7rem; line-height: 1.15; }
.player { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.speed { display: flex; align-items: center; gap: 6px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.speed input { width: 90px; accent-color: var(--accent-strong); }
.toggles { display: flex; gap: 6px; }
.chip-toggle { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: .85rem; color: var(--muted); }
.chip-toggle[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

.reader-grid { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.story { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 28px 32px 32px; min-width: 0; }
.story p { margin: 0 0 1.1em; font-size: var(--read-size); line-height: 2.05; max-width: 34em; }
.sent { border-radius: 6px; transition: background .2s; padding: 2px 0; }
.sent.playing { background: var(--play); box-shadow: 0 0 0 4px var(--play); }
.tr { display: block; font-size: .95rem; line-height: 1.45; color: var(--muted); margin: -2px 0 10px; font-family: var(--f-body); }
.story.hide-tr .tr { display: none; }
.story.show-tr .sent { display: block; }
.w { cursor: pointer; border-radius: 4px; padding: 0 2px; margin: 0 -2px; transition: background .15s, box-shadow .15s; }
.w[data-s="0"] { background: var(--new-bg); }
.w[data-s="1"] { background: var(--l1); }
.w[data-s="2"] { background: var(--l2); }
.w[data-s="3"] { background: var(--l3); }
.w[data-s="4"] { background: var(--l4); }
.w[data-s="0"], .cw[data-s="0"] { box-shadow: inset 0 -2px 0 var(--new-line); }
.w[data-s="1"], .w[data-s="2"], .w[data-s="3"], .w[data-s="4"],
.cw[data-s="1"], .cw[data-s="2"], .cw[data-s="3"], .cw[data-s="4"] { box-shadow: inset 0 -2px 0 var(--l-line); }
.w[data-s="-1"][data-name], .cw[data-s="-1"][data-name] { color: var(--name); text-decoration: underline dotted; text-decoration-color: var(--name); text-decoration-thickness: 2px; text-underline-offset: .32em; }
.legend i.nm { border: 0; color: var(--name); font-style: normal; font-size: .8rem; font-weight: 600; text-align: center; line-height: 14px; text-decoration: underline dotted; }
.w:hover { box-shadow: 0 0 0 2px var(--muted); }
.w.sel, .w.sel:hover { box-shadow: 0 0 0 2px var(--ink); }
.w .rt { display: none; }
.story.roman .w { display: inline-flex; flex-direction: column-reverse; align-items: center; vertical-align: bottom; line-height: 1.5; }
.story.roman .w .rt { display: block; font-size: .5em; line-height: 1; color: var(--muted); font-style: italic; margin-top: .25em; }
.finish { margin-top: 26px; padding-top: 22px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.finish .next-btn { margin-left: auto; }
.finish p { margin: 0; font-size: .95rem; color: var(--muted); max-width: none; line-height: 1.5; }

.panel { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; max-height: calc(100vh - 100px); overflow: auto; }
.panel .hint { color: var(--muted); font-size: .92rem; }
.legend { display: grid; gap: 8px; font-size: .85rem; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 26px; height: 14px; border-radius: 4px; display: inline-block; border: 1px solid var(--line); }
.kbd { font-size: .78rem; color: var(--muted); line-height: 1.7; }
kbd { font-family: inherit; font-size: .75rem; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--bg); }
.wp-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.wp-word { font-family: var(--f-display); font-size: 2.4rem; line-height: 1.1; word-break: break-word; }
.wp-tr { color: var(--muted); font-style: italic; margin-top: 2px; }
.meaning { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; font-size: 1rem; }
.meaning:focus { outline: none; border-color: var(--ink); }
.status-row { display: grid; grid-template-columns: repeat(4, 1fr) 1.6fr; gap: 6px; }
.st { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.st[data-v="1"] { background: var(--l1); border-color: transparent; }
.st[data-v="2"] { background: var(--l2); border-color: transparent; }
.st[data-v="3"] { background: var(--l3); border-color: transparent; }
.st[data-v="4"] { background: var(--l4); border-color: transparent; }
.st[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.st.known[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.status-sub { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .82rem; }
.linkish { background: none; border: 0; padding: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: .82rem; }
.linkish:hover { color: var(--ink); }
.ctx { background: var(--bg); border-radius: 10px; padding: 12px 14px; font-size: 1.05rem; line-height: 1.7; }
.ctx b { font-weight: 600; background: var(--l3); border-radius: 3px; padding: 0 2px; }
.ctx .en { font-size: .88rem; color: var(--muted); line-height: 1.4; margin-top: 4px; }
.ask { border-top: 1px solid var(--line); padding-top: 14px; display: grid; gap: 10px; }
.ask-out { font-size: .92rem; line-height: 1.55; white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 12px 14px; }
.ask-row { display: flex; gap: 8px; flex-wrap: wrap; }
.askform { display: flex; gap: 8px; }
.askform input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 11px; font-size: 1rem; }
.askform input:focus { outline: none; border-color: var(--ink); }
.ask-q { font-size: .88rem; color: var(--muted); margin-bottom: 6px; font-style: italic; }
.sheet-close { display: none; }

@media (max-width: 900px) {
  .reader-grid { grid-template-columns: 1fr; }
  .story { padding: 20px 18px 24px; border-radius: 14px; }
  .panel { position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 40; border-radius: 18px 18px 0 0; max-height: 62vh; padding: 18px 16px calc(18px + env(safe-area-inset-bottom, 0px)); box-shadow: 0 -10px 40px rgba(0,0,0,.18); transform: translateY(105%); transition: transform .22s ease; }
  .panel.open { transform: none; }
  .panel .idle { display: none; }
  .sheet-close { display: inline-grid; }
  .reader-bar .title .display { font-size: 1.45rem; }
}

/* ---------- review ---------- */
.review-wrap { max-width: 560px; margin: 0 auto; display: grid; gap: 16px; }
.progress { height: 4px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent-strong); transition: width .3s; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px; text-align: center; display: grid; gap: 14px; min-height: 300px; align-content: center; }
.card .big { font-family: var(--f-display); font-size: 3.2rem; line-height: 1.15; }
.card .ctx { text-align: left; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grade { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 4px; display: grid; gap: 2px; font-weight: 600; }
.grade small { font-weight: 400; color: var(--muted); font-size: .75rem; font-variant-numeric: tabular-nums; }
.grade.again { color: var(--bad); }
.grade.easy { color: var(--good); }

/* ---------- words ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 16px; }
.search { flex: 1 1 220px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 9px 12px; min-width: 0; }
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.wlist { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.wrow { display: grid; grid-template-columns: minmax(90px, 1.1fr) minmax(0, 2fr) auto; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.wrow:first-child { border-top: 0; }
.wrow .hw { font-size: 1.3rem; font-weight: 500; }
.wrow .hw small { display: block; font-size: .78rem; font-style: italic; color: var(--muted); font-weight: 400; }
.wrow .m { min-width: 0; color: var(--muted); font-size: .92rem; overflow-wrap: anywhere; }
.mini { display: inline-flex; gap: 3px; }
.mini button { width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: .78rem; font-weight: 600; padding: 0; }
.mini button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.mini button[data-v="1"][aria-pressed="true"], .mini button[data-v="2"][aria-pressed="true"], .mini button[data-v="3"][aria-pressed="true"], .mini button[data-v="4"][aria-pressed="true"] { background: var(--accent-strong); color: var(--on-accent); border-color: var(--accent-strong); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chipw { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 12px; text-align: left; display: grid; line-height: 1.3; }
.chipw .h { font-size: 1.15rem; }
.chipw .g { font-size: .75rem; color: var(--muted); }
.chipw[data-s="5"] .h::after { content: " ✓"; color: var(--good); font-size: .85rem; }
.chipw:not([data-s="5"]) { background: var(--l3); border-color: transparent; }
.note { background: var(--sunk); border-radius: 12px; padding: 14px 16px; color: var(--muted); font-size: .92rem; margin-bottom: 16px; max-width: 75ch; }
.more { display: flex; justify-content: center; padding: 14px; }

/* ---------- settings ---------- */
.settings { display: grid; gap: 16px; max-width: 680px; }
.set-card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; display: grid; gap: 12px; }
.set-card h3 { margin: 0; font-size: 1rem; }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; flex-wrap: wrap; }
.set-row label { font-weight: 500; }
.set-row select { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 7px 10px; max-width: 100%; min-width: 0; }
.set-row input[type=range] { accent-color: var(--accent-strong); }
.toast { position: fixed; left: 50%; bottom: calc(90px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: .9rem; z-index: 60; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (min-width: 721px) { .toast { bottom: 28px; } }
/* ---------- vowel-sign reference under stories ---------- */
.sref { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 1rem; line-height: 1.5; }
.sref-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.sref-cons { display: flex; gap: 4px; flex-wrap: wrap; flex: 1; }
.sref .cons { min-width: 36px; padding: 2px 8px; font-size: 1.1rem; }
.sref .abc-grid { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 6px; }
.sref .lt .g { font-size: 1.7rem; }
.story .sref p { font-size: .85rem; line-height: 1.5; max-width: none; }
/* ---------- alphabet ---------- */
.abc-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(82px, 1fr)); gap: 8px; }
.lt { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px 8px; display: grid; justify-items: center; gap: 0; min-width: 0; }
.lt:hover { border-color: var(--muted); }
.lt[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 1px; }
.lt .g { font-family: var(--f-display); font-size: 2.1rem; line-height: 1.25; }
.lt .r { font-size: .85rem; color: var(--muted); }
.lt .x { font-size: .72rem; color: var(--muted); }
.lt .dot { position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; }
.dot.m { background: var(--good); }
.dot.p { background: var(--accent-strong); }
.row-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 22px 0 10px; }
.row-h h3 { margin: 0; font-size: 1rem; font-weight: 600; }
.row-h span { color: var(--muted); font-size: .85rem; }
.detail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 62px); z-index: 5; display: flex; align-items: center; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow); }
.detail-g { font-family: var(--f-display); font-size: 3.6rem; line-height: 1.1; background: var(--bg); border: 0; border-radius: 12px; min-width: 92px; padding: 6px 12px; }
.detail-body { flex: 1; min-width: 0; display: grid; gap: 6px; }
.kvs { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.kv { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.linkish.ex { font-size: 1.2rem; color: var(--ink); }
.cons { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; min-width: 46px; padding: 4px 10px; font-size: 1.35rem; }
.cons[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.conj { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.cj { text-align: left; display: flex; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.cj:hover { border-color: var(--muted); }
.cj .g { font-family: var(--f-display); font-size: 2.3rem; line-height: 1.2; min-width: 64px; text-align: center; }
.cj-body { display: grid; gap: 2px; min-width: 0; }
.cj .parts { color: var(--muted); font-size: .9rem; }
.modes { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
.mode { text-align: left; display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.mode:hover { border-color: var(--muted); }
.mode b { font-size: 1.05rem; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 14px; font-size: 1.15rem; font-weight: 500; text-align: left; }
.opt[lang="hi"] span { font-size: 1.9rem; font-family: var(--f-display); line-height: 1.2; }
.opt:hover:not(:disabled) { border-color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { background: color-mix(in srgb, var(--good) 18%, var(--surface)); border-color: var(--good); }
.opt.wrong { background: color-mix(in srgb, var(--bad) 16%, var(--surface)); border-color: var(--bad); }
@media (max-width: 720px) {
  .detail { top: calc(env(safe-area-inset-top, 0px) + 56px); gap: 12px; padding: 12px; }
  .detail-g { font-size: 2.8rem; min-width: 72px; }
  .abc-grid { grid-template-columns: repeat(auto-fill, minmax(68px, 1fr)); gap: 6px; }
  .lt .g { font-size: 1.8rem; }
}
/* ---------- talk / village game ---------- */
.hud { display: flex; gap: 16px; font-variant-numeric: tabular-nums; }
.hud span { white-space: nowrap; }
.wpop[hidden] { display: none; }
.game .section-h { flex-wrap: wrap; }
.game-grid { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
.map-col { min-width: 0; }
.map-wrap { border-radius: 16px; overflow: hidden; border: 1px solid var(--line); background: var(--gm-grass); line-height: 0; }
#map { width: 100%; display: block; touch-action: manipulation; cursor: pointer; }
.near { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; min-height: 44px; flex-wrap: wrap; }
.side { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; min-width: 0; }
.side.chat-open { padding: 0; display: flex; height: min(660px, calc(100vh - 150px)); }
.chat { display: flex; flex-direction: column; width: 100%; min-height: 0; }
.chat-head { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-log { flex: 1; overflow: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.msg { max-width: 88%; padding: 10px 13px; border-radius: 14px; line-height: 1.5; overflow-wrap: anywhere; }
.msg.npc { background: var(--bg); align-self: flex-start; border-bottom-left-radius: 4px; }
.msg-hi { font-size: 1.3rem; line-height: 1.85; }
.msg-en { color: var(--muted); font-size: .92rem; }
.msg-tools { display: flex; gap: 14px; margin-top: 2px; }
.msg.me { align-self: flex-end; background: var(--ink); color: var(--bg); border-bottom-right-radius: 4px; font-size: 1.05rem; }
.msg.me .fb { margin-top: 7px; font-size: .86rem; background: var(--surface); color: var(--ink); border-radius: 8px; padding: 6px 9px; }
.msg.me .fb.ok { color: var(--good); font-weight: 600; }
.msg.me .fb .linkish { color: var(--ink); font-size: 1.05rem; }
.msg.sys { align-self: center; font-size: .88rem; color: var(--muted); background: var(--sunk); text-align: center; }
.typing span { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin: 0 2px; animation: blink 1.2s infinite; }
.typing span:nth-child(2) { animation-delay: .2s; }
.typing span:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.cw { cursor: pointer; border-radius: 4px; padding: 0 2px; margin: 0 -2px; }
.cw[data-s="0"] { background: var(--new-bg); }
.cw[data-s="1"] { background: var(--l1); }
.cw[data-s="2"] { background: var(--l2); }
.cw[data-s="3"] { background: var(--l3); }
.cw[data-s="4"] { background: var(--l4); }
.cw:hover { box-shadow: 0 0 0 2px var(--line); }
.wpop { margin: 0 16px 8px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); display: grid; gap: 10px; }
.sugg { display: grid; gap: 6px; padding: 0 16px 8px; }
.sg { text-align: left; display: grid; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.sg:hover { border-color: var(--muted); }
.sg span[lang] { font-size: 1.15rem; }
.acbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 16px 0; }
.acbar[hidden] { display: none; }
.acchip { border: 1px solid var(--new-line); background: var(--new-bg); border-radius: 999px; padding: 3px 10px; font-size: .8rem; display: inline-flex; gap: 4px; align-items: baseline; }
.acchip span[lang] { font-size: 1.1rem; }
.acchip kbd { align-self: center; font-size: .7rem; padding: 0 5px; margin-right: 2px; color: var(--ink); }
.chat-input { display: flex; gap: 8px; padding: 10px 16px 6px; border-top: 1px solid var(--line); }
.chat-input input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 1.05rem; }
.chat-input input:focus { outline: none; border-color: var(--ink); }
.chat-tools { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 0 16px 12px; flex-wrap: wrap; }
.linkish:disabled { opacity: .45; cursor: default; }
.qlist { display: grid; gap: 4px; }
.bag { display: flex; flex-wrap: wrap; gap: 6px; }
.bagchip { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 3px 10px; font-size: .82rem; display: inline-flex; gap: 4px; align-items: baseline; }
.bagchip span[lang] { font-size: 1.05rem; }
.bagchip.coin { background: var(--sunk); }
.chat-bag { padding: 8px 16px 10px; border-bottom: 1px solid var(--line); display: grid; gap: 6px; }
.req { font-size: .82rem; }
.deal { margin-top: 8px; border: 1px dashed var(--accent-strong); border-radius: 10px; padding: 8px 10px; font-size: .88rem; display: grid; gap: 6px; background: var(--surface); }
.deal .row { display: flex; gap: 8px; flex-wrap: wrap; }
.hud .btn { padding: 4px 10px; font-size: .85rem; }
.give-wrap { padding: 0; overflow: hidden; gap: 0; align-items: stretch; }
.give-wrap .bagword { background: none; border: 0; padding: 3px 8px 3px 10px; font-size: .82rem; display: inline-flex; gap: 4px; align-items: baseline; }
.give-wrap .give { border: 0; border-left: 1px solid var(--line); background: var(--accent-strong); color: var(--on-accent); font-weight: 600; font-size: .78rem; padding: 0 10px; }
.chat-tabs { justify-self: start; }
.shop { display: grid; gap: 6px; }
.shop-row { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 10px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.shop-name { font-size: 1.2rem; color: var(--ink); text-decoration: none; text-align: left; }
.price { font-variant-numeric: tabular-nums; font-weight: 600; }
.inv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.inv-card { display: grid; gap: 2px; text-align: left; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.inv-card .g { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.2; }
.inv-card.coin .g { font-family: var(--f-body); font-weight: 600; }
.qlist.other .qrow { opacity: .7; }
.deal.done { border-style: solid; border-color: var(--good); color: var(--good); }
.deal.bad { border-color: var(--bad); }
.qrow { display: flex; gap: 10px; align-items: flex-start; text-align: left; background: none; border: 1px solid transparent; border-radius: 10px; padding: 8px 10px; }
.qrow:hover { background: var(--bg); border-color: var(--line); }
.qdot { width: 12px; height: 12px; border-radius: 50%; flex: none; margin-top: 6px; }
.qdot.big { width: 16px; height: 16px; margin: 0; }
@media (max-width: 900px) {
  .game-grid { grid-template-columns: 1fr; }
  .side.chat-open { position: fixed; inset: 0; z-index: 45; border-radius: 0; border: 0; height: auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
}

/* ---------- Thor standalone ---------- */
.standalone:not(.gh) .sync { display: none; }
.flags { display: inline-flex; gap: 2px; margin-left: 4px; }
.flag { border: 1px solid transparent; background: none; border-radius: 8px; font-size: 1.35rem; line-height: 1; padding: 4px 6px; opacity: .45; filter: grayscale(.6); }
.flag[aria-pressed="true"] { opacity: 1; filter: none; border-color: var(--line); background: var(--surface); }
.flag:hover { opacity: 1; filter: none; }
@media (max-width: 720px) { .flags { margin-left: auto; } }
/* ---------- Français: light, Parisian café ---------- */
:root.lang-fr {
  --bg: #f7f1e5; --surface: #fffdf8; --sunk: #efe6d4; --ink: #1d2b4f; --muted: #6a6f86; --line: #e2d6bf;
  --accent: #b3303d; --accent-strong: #d9a441; --on-accent: #2a1d00;
  --new: #2c58b8; --new-bg: rgba(44, 88, 184, .16); --new-line: rgba(44, 88, 184, .8); --name: #8a4f9e;
  --l1: rgba(217, 164, 65, .55); --l2: rgba(217, 164, 65, .4); --l3: rgba(217, 164, 65, .28); --l4: rgba(217, 164, 65, .16); --l-line: rgba(176, 124, 30, .9);
  --play: rgba(179, 48, 61, .07); --good: #2f7d5b; --bad: #b3303d;
  --shadow: 0 1px 2px rgba(29, 43, 79, .06), 0 8px 26px rgba(29, 43, 79, .08);
  --f-display: "Playfair Display", "Didot", Georgia, serif;
  --f-body: "Source Sans 3", "Avenir Next", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gold: #b8892a; --gold-2: #e8c870; --gold-bg: rgba(217, 164, 65, .14);
  color-scheme: light;
}
.lang-fr body { background: var(--bg) radial-gradient(circle at 1px 1px, rgba(29, 43, 79, .05) 1px, transparent 0) 0 0 / 22px 22px; }
.lang-fr .top { border-bottom: 0; box-shadow: 0 1px 0 var(--line); }
.lang-fr .top::before { content: ""; display: block; height: 5px; background: linear-gradient(90deg, #2c58b8 0 33.3%, #fffdf8 33.3% 66.6%, #b3303d 66.6%); }
.lang-fr .brand .display { font-style: italic; font-weight: 700; color: var(--ink); font-size: 1.75rem; }
.lang-fr .brand .small { font-family: var(--f-display); font-style: italic; color: var(--accent); white-space: nowrap; }
.lang-fr .lesson { border-radius: 4px 18px 4px 18px; }
.lang-fr .lesson .t, .lang-fr .reader-bar .title .display, .lang-fr .section-h h2 { font-family: var(--f-display); }
.lang-fr .lesson .t { font-size: 1.5rem; font-weight: 500; }
.lang-fr .story { border-radius: 4px; box-shadow: var(--shadow); }
.lang-fr .story p { font-family: var(--f-display); line-height: 1.95; }
.lang-fr .wp-word, .lang-fr .card .big { font-family: var(--f-display); }
.lang-fr .btn.primary, .lang-fr .icon-btn.big, .lang-fr .chip-toggle[aria-pressed="true"] { background: var(--ink); }
.lang-fr .tab[aria-current="page"] { color: var(--accent); }
.lang-fr [data-toggle="roman"], .lang-fr .sref { display: none !important; }
.lang-fr .rank-medal span { color: #3a2600; }
.deb { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(260px, 1fr); gap: 16px; align-items: stretch; margin-bottom: 24px; }
@media (max-width: 760px) { .deb { grid-template-columns: 1fr; } }
.deb-hello { background: var(--surface); border: 1px solid var(--line); border-radius: 4px 22px 4px 22px; padding: 18px 22px; display: grid; gap: 4px; align-content: center; box-shadow: var(--shadow); }
.deb-fr { font-family: var(--f-display); font-style: italic; font-size: 1.6rem; line-height: 1.25; color: var(--ink); }
.deb-say { width: 32px; height: 32px; font-size: .85rem; vertical-align: middle; margin-left: 4px; font-style: normal; }
.treat { display: flex; gap: 14px; align-items: center; text-align: left; background: linear-gradient(135deg, rgba(217,164,65,.16), transparent 70%), var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px 18px; box-shadow: var(--shadow); width: 100%; }
.treat.got { border-color: rgba(184,137,42,.6); }
.treat-ico { width: 64px; height: 64px; flex: none; display: grid; place-items: center; border-radius: 50%; background: #fff6e2; box-shadow: inset 0 0 0 2px rgba(217,164,65,.35); }
.treat:not(.got) .treat-ico { filter: grayscale(.55); opacity: .75; }
.treat-ico svg, .pastry-ico svg { width: 72%; height: 72%; }
.emo { font-size: 2.3rem; line-height: 1; }
.treat-body { display: grid; gap: 6px; flex: 1; min-width: 0; }
.treat-body b { font-family: var(--f-display); font-size: 1.1rem; font-weight: 500; }
.treat-bar { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: block; }
.treat-bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #d9a441, #e8c870); }
.bakery { max-width: 1000px; display: grid; gap: 20px; }
.bakery-sign { text-align: center; padding: 8px 0 0; }
.bakery-sign h2 { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 2.3rem; margin: 6px 0 2px; color: var(--accent); }
.pastries { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
.pastry { font: inherit; color: inherit; cursor: default; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 10px 14px; display: grid; justify-items: center; gap: 4px; text-align: center; }
.pastry-ico { width: 86px; height: 86px; border-radius: 50%; display: grid; place-items: center; background: var(--sunk); position: relative; filter: grayscale(1) brightness(1.15); opacity: .35; }
.pastry-ico .emo { font-size: 3rem; }
.pastry.on { cursor: pointer; box-shadow: var(--shadow); }
.pastry.on .pastry-ico { filter: none; opacity: 1; background: radial-gradient(circle at 40% 35%, #fffaf0, #f7e6c4); box-shadow: inset 0 0 0 2px rgba(217,164,65,.4); }
.pastry-n { position: absolute; right: -4px; bottom: -2px; background: var(--accent); color: #fff; font-size: .75rem; font-weight: 700; border-radius: 99px; padding: 1px 7px; }
.pastry-fr { font-family: var(--f-display); font-size: 1.05rem; }
.pastry.pick { box-shadow: 0 0 0 3px var(--accent-strong); }
.showcase { position: relative; height: 340px; border-radius: 22px; overflow: hidden; background: radial-gradient(ellipse at 50% 30%, #fff6dd, #f1dfb8 55%, #d9bf8a); box-shadow: var(--shadow); }
.showcase canvas { width: 100%; height: 100%; display: block; }
.show-mystery { position: absolute; inset: 0; display: grid; place-items: center; font-size: 7rem; opacity: .5; }
.dual .show-mystery { font-size: 16rem; }
.treat-tier { font-size: .8rem; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.show-label { position: absolute; left: 0; right: 0; top: 14px; display: grid; justify-items: center; gap: 2px; text-align: center; color: #3b2a12; }
.show-label b { font-family: var(--f-display); font-size: 1.8rem; font-style: italic; } .show-label span { font-size: .9rem; opacity: .8; }
.dual .bakery > :not(.showcase) { display: none; } .dual .bakery { max-width: none; }
.dual .showcase { height: calc(100vh - 50px); border-radius: 0; } .dual .show-label b { font-size: 3.4rem; } .dual .show-label span { font-size: 1.4rem; }
.dual main:has(.bakery), .dual main:has(.deb), .dual main:has(.adv) { padding-top: 36px !important; }
.adv { max-width: 900px; margin: 0 auto; display: grid; gap: 16px; }
.adv-chs { display: grid; gap: 10px; }
.adv-ch { display: flex; gap: 16px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 18px; font: inherit; color: inherit; }
.adv-ch.pick { border-color: var(--accent-strong); box-shadow: 0 0 0 2px var(--accent-strong); }
.adv-ch.locked { opacity: .75; }
.adv-n { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--sunk); font-size: 1.2rem; font-weight: 700; }
.adv-t { display: grid; gap: 4px; flex: 1; }
.adv-t b { font-size: 1.5rem; font-weight: 400; }
.adv-bar { height: 8px; border-radius: 99px; background: var(--sunk); overflow: hidden; display: block; max-width: 360px; }

/* ===================== romanization ===================== */
const CONS = { "क":"k","ख":"kh","ग":"g","घ":"gh","ङ":"n","च":"ch","छ":"chh","ज":"j","झ":"jh","ञ":"n","ट":"t","ठ":"th","ड":"d","ढ":"dh","ण":"n","त":"t","थ":"th","द":"d","ध":"dh","न":"n","प":"p","फ":"ph","ब":"b","भ":"bh","म":"m","य":"y","र":"r","ल":"l","व":"v","श":"sh","ष":"sh","स":"s","ह":"h" };
const NUKTA = { "क":"q","ख":"kh","ग":"gh","ज":"z","ड":"d","ढ":"dh","फ":"f","य":"y" };
const VOW = { "अ":"a","आ":"aa","इ":"i","ई":"ee","उ":"u","ऊ":"oo","ऋ":"ri","ए":"e","ऐ":"ai","ओ":"o","औ":"au","ऑ":"o" };
const MATRA = { "ा":"aa","ि":"i","ी":"ee","ु":"u","ू":"oo","ृ":"ri","े":"e","ै":"ai","ो":"o","ौ":"au","ॉ":"o" };
function roman(word) {
  if (FR) return "";
  const u = [];
  for (const c of word.normalize("NFD")) {
    const last = u[u.length - 1];
    if (CONS[c]) u.push({ c: 1, base: c, r: CONS[c], v: "a", n: "" });
    else if (c === "़" && last) last.r = NUKTA[last.base] || last.r;
    else if (MATRA[c] && last) last.v = MATRA[c];
    else if (c === "्" && last) last.v = "";
    else if ((c === "ं" || c === "ँ") && last) last.n = "N";
    else if (c === "ः" && last) last.n = "h";
    else if (VOW[c]) u.push({ c: 0, r: "", v: VOW[c], n: "" });
  }
  const n = u.length;
  if (!n) return "";
  const end = u[n - 1];
  if (n > 1 && end.c && end.v === "a" && !end.n) end.v = "";
  for (let i = n - 2; i >= 1; i--) {
    const x = u[i], p = u[i - 1], nx = u[i + 1];
    if (x.c && x.v === "a" && !x.n && p.v !== "" && nx.c && nx.v !== "") { x.v = ""; i--; }
  }
  let out = "";
  u.forEach((x, i) => {
    const isEnd = i === n - 1;
    let v = x.v;
    if (isEnd && !x.n && v === "aa" && n > 1) v = "a";
    if (isEnd && v === "ee" && n > 1) v = "i";
    out += x.r + v;
    if (x.n === "N") {
      if (isEnd && v === "e") out = out.slice(0, -1) + "ein";
      else { const nr = u[i + 1] ? u[i + 1].r : ""; out += /^(p|b|m)/.test(nr) ? "m" : "n"; }
    } else if (x.n === "h") out += "h";
  });
  return out;
}

const ABC_LETTERS = [...ABC_VOWELS, ...ABC_ROWS.flatMap(r => r.items)];

ABC_ROWS.forEach((r, i) => r.items.forEach(l => (ABC_ROW_OF[l.g] = i)));

const QUIZ_SKIP = new Set(["ङ", "ञ"]);
const HEAR_SKIP = new Set(["ङ", "ञ", "ण", "ष", "ऋ", "क़", "ख़", "ग़"]);

let abcProg = store.get("abc", { k: {} });
const abcState = { tab: "chart", sel: "अ", cons: "क", quiz: null };
function effAbc() { const p = pending["alphabet/progress"]; return p ? deepMerge(abcProg, p) : abcProg; }
function sylRoman(c, m) {
  const base = ABC_BY_G[c].r.replace(/a$/, "");
  if (m === "") return base + "a";
  if (m === "ं") return base + "aṁ";
  const v = ABC_VOWELS.find(x => x.m === m);

}
function letterState(g) {
  const p = (effAbc().k || {})[g];
  if (!p) return "";
  return (p.st || 0) >= 3 ? "m" : "p";
}
function recordAbc(key, ok) {
  const cur = (effAbc().k || {})[key] || {};
  enqueue("alphabet/progress", { k: { [key]: { c: (cur.c || 0) + (ok ? 1 : 0), w: (cur.w || 0) + (ok ? 0 : 1), st: ok ? (cur.st || 0) + 1 : 0, t: Date.now() } } });
}
function abcWeight(key) {
  const p = (effAbc().k || {})[key];

  return Math.max(0.3, 1 + 3 * (p.w || 0) / ((p.c || 0) + (p.w || 0) + 1) - 0.25 * (p.st || 0));
}
function weightedPick(pool, keyOf, avoid) {
  const items = pool.filter(x => keyOf(x) !== avoid);
  const ws = items.map(x => abcWeight(keyOf(x)));
  let r = Math.random() * ws.reduce((a, b) => a + b, 0);
  for (let i = 0; i < items.length; i++) { r -= ws[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  const all = ABC_LETTERS.filter(l => !QUIZ_SKIP.has(l.g) && l.g !== g);

function makeQuiz(mode) {
  const items = [];
  let last = null;
  for (let i = 0; i < 10; i++) {
    let q;
    if (mode === "see" || mode === "hear") {
      const pool = ABC_LETTERS.filter(l => !QUIZ_SKIP.has(l.g) && !(mode === "hear" && HEAR_SKIP.has(l.g)));
      const L = weightedPick(pool, l => l.g, last); last = L.g;
      const others = nearbyLetters(L.g).filter(l => mode === "see" || !HEAR_SKIP.has(l.g));
      if (mode === "see") {
        const opts = shuffle([L.r, ...distractors(L.r, others.map(l => l.r))]);
        q = { mode, key: L.g, prompt: L.g, say: L.g, opts, answer: L.r };
      } else {
        const opts = shuffle([L.g, ...distractors(L.g, others.map(l => l.g))]);
        q = { mode, key: L.g, prompt: "", say: L.g, opts, answer: L.g, label: L.r };
      }
    } else if (mode === "signs") {
      const keyed = SYL_MATRAS.filter(m => m).map(m => ({ m }));
      const pick = weightedPick(keyed, x => x.m, last); last = pick.m;
      const c = SYL_CONS[Math.floor(Math.random() * SYL_CONS.length)];
      const ans = sylRoman(c, pick.m);
      const opts = shuffle([ans, ...distractors(ans, SYL_MATRAS.filter(m => m !== pick.m).map(m => sylRoman(c, m)))]);
      q = { mode, key: pick.m, prompt: c + pick.m, say: c + pick.m, opts, answer: ans };
    } else {
      const words = Object.keys(V).filter(w => V[w].s !== -1 && w.length >= 2 && w.length <= 6 && !w.includes(" "));
      if (words.length < 4) return null;
      let w = words[Math.floor(Math.random() * words.length)];
      if (w === last) w = words[Math.floor(Math.random() * words.length)];
      last = w;
      const ans = romanOf(w);
      const opts = shuffle([ans, ...distractors(ans, shuffle([...words]).slice(0, 40).map(x => romanOf(x)))]);
      q = { mode, key: null, prompt: w, say: w, opts, answer: ans, meaning: V[w].m || "" };

  if (q.key) recordAbc(q.key, ok);
  if (q.mode !== "hear") speak(q.say, { rate: Math.min(settings.rate, 0.8) });

}

  const Q = abcState.quiz; if (!Q) return;
  Q.i++; Q.picked = null;

function viewQuiz() {
  const Q = abcState.quiz;
  const modes = [
    ["see", "Read letters", "See a letter, pick its sound"],
    ["hear", "Listen", "Hear a sound, pick the letter"],
    ["signs", "Vowel signs", "Read syllables like कि, को, मू"],
    ["words", "Read words", "Sound out words from your list"]
  ];
  const menu = `<div class="modes">${modes.map(([id, t, d]) => `<button class="mode" data-qmode="${id}"><b>${t}</b><span class="muted small">${d}</span></button>`).join("")}</div>
    <p class="muted small" style="margin-top:14px">Each round has 10 questions. Letters you get wrong come up more often. A letter turns <b style="color:var(--good)">green</b> on the chart after 3 right answers in a row.</p>`;
  if (!Q) return menu;
  if (Q.i >= Q.items.length) {
    const missed = [...new Map(Q.missed.map(q => [q.prompt || q.say, q])).values()];
    return `<div class="review-wrap"><div class="card" style="min-height:0">
      <div class="big" style="font-family:var(--f-body);font-weight:600">${Q.score} / ${Q.items.length}</div>
      <div class="muted">${Q.score === Q.items.length ? "Perfect round!" : Q.score >= 7 ? "Nice work." : "Keep going, it gets easier."}</div>
      ${missed.length ? `<div><div class="label" style="margin-bottom:8px">To look at again</div><div class="chips" style="justify-content:center">${missed.map(q => `<button class="chipw" data-say="${esc(q.say)}"><span class="h" lang="hi">${esc(q.mode === "hear" ? q.answer : q.prompt)}</span><span class="g">${esc(q.mode === "hear" ? q.label : q.answer)}</span></button>`).join("")}</div></div>` : ""}
      <div class="ask-row" style="justify-content:center"><button class="btn primary" data-qmode="${Q.mode}">Another round</button><button class="btn" data-act="qquit">Choose practice</button></div>
    </div></div>`;
  }
  const q = Q.items[Q.i];
  const prompt = q.mode === "hear"
    ? `<button class="icon-btn big" data-act="qsay" aria-label="Play the sound again" style="width:84px;height:84px;font-size:1.8rem;margin:0 auto">🔊</button><div class="muted small">Which letter is this?</div>`
    : `<div class="big" lang="hi">${esc(q.prompt)}</div><div class="muted small">${q.mode === "words" ? "How do you say this word?" : "How do you say this?"}</div>`;
  const after = Q.picked != null
    ? `<div class="small" style="min-height:1.5em">${q.opts[Q.picked] === q.answer ? `<b style="color:var(--good)">Right!</b>` : `<b style="color:var(--bad)">Not quite.</b> It's <b>${esc(q.mode === "hear" ? q.answer + " (" + q.label + ")" : q.answer)}</b>`}${q.meaning ? ` · ${esc(q.meaning)}` : ""}</div>`
    : `<div class="small" style="min-height:1.5em"></div>`;
  return `<div class="review-wrap">
    <div class="section-h"><span class="muted small">${esc({ see: "Read letters", hear: "Listen", signs: "Vowel signs", words: "Read words" }[q.mode])}</span><span class="muted small" style="font-variant-numeric:tabular-nums">${Q.i + 1} / ${Q.items.length} · ${Q.score} right</span></div>
    <div class="progress"><i style="width:${(Q.i / Q.items.length) * 100}%"></i></div>
    <div class="card" style="min-height:220px">${prompt}${after}</div>
    <div class="opts">${q.opts.map((o, i) => {
      const cls = Q.picked == null ? "" : o === q.answer ? "right" : i === Q.picked ? "wrong" : "";
      return `<button class="opt ${cls}" data-opt="${i}" ${Q.picked != null ? "disabled" : ""} ${q.mode === "hear" ? 'lang="hi"' : ""}><kbd>${i + 1}</kbd><span>${esc(o)}</span></button>`;
    }).join("")}</div>
    <div style="display:flex;justify-content:space-between;gap:8px"><button class="btn ghost" data-act="qquit">End round</button>${Q.picked != null ? `<button class="btn primary" data-act="qnext">Next →</button>` : ""}</div>
  </div>`;
}

function cleanBundle(b) {

function checkDeal(n, raw) {
  const give = cleanBundle(raw && raw.give), get = cleanBundle(raw && raw.get);
  if (!give || !get) return { ok: false, why: "That deal used something that doesn't exist in this village." };
  const inv = inventory(); const econ = ECON[n.id];
  if (give.coins > inv.coins) return { ok: false, why: `You only have ${inv.coins} coins.` };
  for (const [it, c] of Object.entries(give.items)) if ((inv.items[it] || 0) < c) return { ok: false, why: `You don't have ${itemLabel(it, c)}.` };
  const e = curErrand(n.id);
  if (e && (give.items[e.item] || 0) >= e.qty) {
    return { ok: true, errand: true, give: { coins: 0, items: { [e.item]: e.qty } }, get: { coins: e.reward.coins || 0, items: { ...(e.reward.items || {}) } } };
  }
  for (const it of Object.keys(get.items)) if (!(it in econ.sells)) return { ok: false, why: `${n.en} doesn't have ${itemLabel(it, 1)} to give.` };
  const itemVal = items => Object.entries(items).reduce((s, [it, c]) => s + ITEMS[it].v * c, 0);
  const valGive = give.coins + itemVal(give.items);
  const valGet = get.coins + Object.entries(get.items).reduce((s, [it, c]) => s + (econ.sells[it] ?? ITEMS[it].v) * c, 0);
  if (!valGive && !valGet) return { ok: false, why: "There's nothing to swap in that deal." };
  if (get.coins > itemVal(give.items)) return { ok: false, why: `${n.en} won't pay that much for it.` };
  if (valGive < Math.ceil(valGet * 0.6)) return { ok: false, why: "That's too cheap. They want more for it." };

}
function doDeal(n, d) {

  const patch = { coins: inv.coins - d.give.coins + d.get.coins, inv: patchInv };
  if (d.errand) { patch.mis = { [n.id]: misIdx(n.id) + 1 }; patch.misTurns = { [n.id]: 0 }; keyHint(d.get.items); }

function bfs(sx, sy, goalFn) {
  const prev = new Map(); const key = (x, y) => x + "," + y;
  const q = [[sx, sy]]; prev.set(key(sx, sy), null);
  while (q.length) {
    const [x, y] = q.shift();
    if (goalFn(x, y) && !(x === sx && y === sy && !goalFn.allowStart)) {
      const path = []; let k = key(x, y);
      while (k && k !== key(sx, sy)) { const [a, b] = k.split(",").map(Number); path.unshift([a, b]); k = prev.get(k); }
      return path;
    }
    for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
      const nx = x + dx, ny = y + dy;
      if (!prev.has(key(nx, ny)) && walkable(nx, ny)) { prev.set(key(nx, ny), key(x, y)); q.push([nx, ny]); }
    }
  }

}

  if (adjacent(n, game.px, game.py) && !game.path.length) { openTalk(n); return; }

document.addEventListener("change", e => {

document.addEventListener("keydown", e => {
  const typing = e.target.matches("input, textarea, select");
  if (e.target.id === "tinput" && e.key === "Tab" && talk.ac && talk.ac.length) { e.preventDefault(); acPick(0); return; }
  // While suggestions are showing for a word being typed, number keys pick them.
  if (e.target.id === "tinput" && /^[1-9]$/.test(e.key) && !e.ctrlKey && !e.metaKey && !e.altKey && talk.ac && talk.ac.length && acToken(e.target.value).length >= 2) {
    const i = +e.key - 1; if (i < talk.ac.length) { e.preventDefault(); acPick(i); return; }
  }
  if (e.target.id === "meaning" && e.key === "Enter") { e.preventDefault(); saveMeaning(); e.target.blur(); toast("Meaning saved"); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (route.view === "reader") {
    const words = $$("#story .w");
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault(); saveMeaning();
      const cur = sel ? sel.k : -1;
      const nk = e.key === "ArrowRight" ? Math.min(words.length - 1, cur + 1) : Math.max(0, cur - 1);
      const el = words[nk]; if (el) { selectWord(el); el.scrollIntoView({ block: "nearest" }); }
    } else if (e.key === " ") { e.preventDefault(); $("#playBtn")?.click(); }
    else if (e.key === "Escape") { saveMeaning(); selectWord(null); }
    else if (sel && /^[1-4]$/.test(e.key)) setStatus(+e.key);
    else if (sel && (e.key === "k" || e.key === "5")) setStatus(5);
    else if (sel && e.key === "x") setStatus(-1);
    else if (sel && e.key === "p") speak(sel.w);
    else if (e.key === "n") goNextLesson();
  } else if (route.view === "talk") {
    const dirs = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
    if (e.key === "Escape" && talk.npc) closeTalk();
    else if (dirs[e.key] && !talk.npc) { e.preventDefault(); stepKey(...dirs[e.key]); }
    else if ((e.key === " " || e.key === "Enter") && !talk.npc && game.near) { e.preventDefault(); if (game.near.has) openChest(game.near); else openTalk(game.near); }
  } else if (route.view === "alphabet" && abcState.quiz && abcState.quiz.i < abcState.quiz.items.length) {
    const Q = abcState.quiz;
    if (Q.picked == null && /^[1-4]$/.test(e.key)) answerQuiz(+e.key - 1);
    else if (Q.picked != null && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); nextQuiz(); }
  } else if (route.view === "review" && rv.i < rv.queue.length) {
    if (e.key === " " && !rv.shown) { e.preventDefault(); rv.shown = true; render(); speak(rv.queue[rv.i]); }
    else if (rv.shown && /^[1-4]$/.test(e.key)) grade(+e.key);
  }
});

\"Just a letter\"? You shout, and everyone gets scared!"}, {"w": "meera", "e": "n", "hi": "अगर आप कुछ नहीं बताते, तो मैं आपकी मदद कैसे करती हूँ?", "en": "If you don't tell me anything, how can I help you?"}, {"w": "~", "e": "n", "hi": "वह ठीक कहती हैं। अब मुझे सच बताना है।", "en": "She's right. I have to tell the truth now."}, {"retry": 1}, {"lb": "c3tell"}, {"w": "andy", "e": "n", "hi": "लंदन में, एक पुरानी किताब में, मुझे एक चिट्ठी मिलती है।", "en": "In London, inside an old book, I found a letter."}, {"cut": "letter"}, {"w": "andy", "e": "n", "hi": "चिट्ठी हिंदी में है। उस पर लिखा है: \"होटल चाँदनी, कमरा सात।\"", "en": "It's in Hindi. On it is written: \"Hotel Chandni, Room Seven.\""}, {"w": "andy", "e": "n", "hi": "और ऊपर एक नाम है: \"मीरा दीदी\"।", "en": "And at the top there's a name: \"Meera Didi.\""}, {"w": "~", "e": "n", "hi": "मीरा जी का हाथ काँपता है। मोमबत्ती भी।", "en": "Meera ji's hand trembles. So does the candle."}, {"uncut": 1}, {"w": "meera", "e": "sur", "hi": "मीरा दीदी...?", "en": "Meera Didi...?"}, {"w": "andy", "e": "n", "hi": "और नीचे एक और नाम है: \"लता\"।", "en": "And at the bottom there's another name: \"Lata.\""}, {"w": "meera", "e": "sad", "hi": "लता...", "en": "Lata..."}, {"w": "meera", "e": "sad", "hi": "लता मेरी छोटी बहन है।", "en": "Lata is my little sister."}, {"w": "meera", "e": "sad", "hi": "तीस साल से मैं उसे नहीं देखती।", "en": "I haven't seen her for thirty years."}, {"w": "andy", "e": "sur", "hi": "तीस साल!", "en": "Thirty years!"}, {"w": "meera", "e": "sad", "hi": "वह लंदन में रहती है... या रहती थी। मुझे पता नहीं।", "en": "She lives in London... or she did. I don't know."}, {"w": "meera", "e": "wor", "hi": "और कमरा सात... कमरा सात लता का कमरा था।", "en": "And room seven... room seven was Lata's room."}, {"w": "~", "e": "n", "hi": "अब मैं समझता हूँ।", "en": "Now I understand."}, {"w": "meera", "e": "ang", "hi": "और अब वह चिट्ठी किसी के पास है! इस घर में!", "en": "And now someone has that letter! Here, in this house!"}, {"w": "meera", "e": "n", "hi": "एंडी जी, वह चिट्ठी ढूँढिए। मेरे लिए।", "en": "Andy ji, find that letter. For me."}, {"w": "andy", "e": "n", "hi": "हाँ, मीरा जी। मैं चिट्ठी ढूँढता हूँ।", "en": "Yes, Meera ji. I'll find it."}, {"show": []}, {"w": "~", "e": "n", "hi": "मीरा जी अपने कमरे में जाती हैं।", "en": "Meera ji goes to her room."}, {"w": "~", "e": "n", "hi": "अब मैं सोचता हूँ। अँधेरे में कौन था?", "en": "Now I think. Who was here in the dark?"}, {"w": "~", "e": "n", "hi": "गोलू, रहीम चाचा, डॉक्टर कपूर, अनीता... और बादल।", "en": "Golu, Rahim Chacha, Doctor Kapoor, Anita... and Badal."}, {"w": "~", "e": "n", "hi": "मैं मोमबत्ती लेता हूँ और कमरा देखता हूँ।", "en": "I pick up a candle and search the room."}, {"lb": "c3look"}, {"ch": [{"hi": "मेज़ के नीचे देखता हूँ।", "en": "Look under the table.", "go": "c3table", "done": "clue_wet"}, {"hi": "दरवाज़े के पास देखता हूँ।", "en": "Look by the door.", "go": "c3door", "done": "clue_steps"}, {"hi": "बिल्ली को देखता हूँ।", "en": "Look at the cat.", "go": "c3cat", "done": "clue_photo"}, {"hi": "बस, अब मैं सोचता हूँ।", "en": "That's enough, now I think.", "go": "c3done", "if": "clue_wet&clue_steps&clue_photo"}]}, {"lb": "c3table"}, {"w": "~", "e": "n", "hi": "मेज़ के नीचे एक चम्मच है... और सब गीला है।", "en": "Under the table there's a spoon... and everything is wet."}, {"w": "~", "e": "n", "hi": "यह बारिश का पानी है!", "en": "It's rainwater!"}, {"w": "~", "e": "n", "hi": "कोई बाहर से आता है, और उसके जूते गीले हैं।", "en": "Someone came in from outside, with wet shoes."}, {"set": ["clue_wet"]}, {"go": "c3look"}, {"lb": "c3door"}, {"w": "~", "e": "n", "hi": "दरवाज़े के पास पानी के निशान हैं। जूतों के निशान!", "en": "By the door there are wet marks. Footprints!"}, {"w": "~", "e": "n", "hi": "निशान सीढ़ियों पर जाते हैं। ऊपर!", "en": "The footprints go up the stairs. Upstairs!"}, {"w": "~", "e": "n", "hi": "ऊपर कमरे हैं। मेरा कमरा... और कमरा सात।", "en": "Upstairs are the rooms. My room... and room seven."}, {"set": ["clue_steps"]}, {"go": "c3look"}, {"lb": "c3cat"}, {"show": ["badal"]}, {"w": "badal", "e": "n", "hi": "म्याऊँ।", "en": "Meow."}, {"w": "~", "e": "n", "hi": "बादल के मुँह में कुछ है। एक छोटा कागज़!", "en": "Badal has something in her mouth. A little piece of paper!"}, {"ch": [{"hi": "बादल को दूध देता हूँ।", "en": "Give Badal some milk.", "go": "c3milk", "set": "catfriend"}, {"hi": "कागज़ जल्दी पकड़ता हूँ।", "en": "Grab the paper quickly.", "go": "c3grab"}]}, {"lb": "c3grab"}, {"w": "~", "e": "n", "hi": "मैं कागज़ पकड़ता हूँ... और बादल भागती है!", "en": "I grab for the paper... and Badal runs!"}, {"w": "badal", "e": "ang", "hi": "फ़्फ़्फ़!", "en": "Hsss!"}, {"w": "~", "e": "n", "hi": "अरे। कागज़ भी उसके साथ जाता है।", "en": "Oh no. The paper goes with her."}, {"w": "~", "e": "n", "hi": "शायद बिल्ली को कुछ चाहिए...", "en": "Maybe the cat wants something..."}, {"retry": 1}, {"lb": "c3milk"}, {"w": "~", "e": "n", "hi": "मैं रसोई से थोड़ा दूध लाता हूँ।", "en": "I bring a little milk from the kitchen."}, {"w": "badal", "e": "h", "hi": "म्याऊँ!", "en": "Meow!"}, {"w": "~", "e": "n", "hi": "बादल दूध पीती है। अब कागज़ नीचे है।", "en": "Badal drinks the milk. She drops the paper."}, {"cut": "photo"}, {"w": "~", "e": "n", "hi": "यह कागज़ नहीं है। यह एक छोटी फ़ोटो है!", "en": "It's not paper. It's a little photo!"}, {"w": "~", "e": "n", "hi": "फ़ोटो बहुत पुरानी है। फ़ोटो में दो लड़कियाँ हैं, इस होटल के बाहर।", "en": "The photo is very old. Two girls, outside this hotel."}, {"w": "~", "e": "n", "hi": "हाँ! यह फ़ोटो चिट्ठी के साथ थी!", "en": "Yes! This photo was with the letter!"}, {"w": "~", "e": "n", "hi": "चोर के हाथ से यह फ़ोटो गिरती है, अँधेरे में।", "en": "The thief dropped it in the dark."}, {"uncut": 1}, {"get": "photo"}, {"set": ["clue_photo"]}, {"show": []}, {"go": "c3look"}, {"lb": "c3done"}, {"w": "~", "e": "n", "hi": "तो: गीले जूते, सीढ़ियों पर निशान, और चिट्ठी की फ़ोटो।", "en": "So: wet shoes, footprints on the stairs, and the letter's photo."}, {"w": "~", "e": "n", "hi": "चोर इसी होटल ाता हूँ।", "en": "I step into room seven."}, {"w": "~", "e": "n", "hi": "यहाँ सब कुछ पुराना है। एक बिस्तर, एक कुर्सी, और एक हारमोनियम।", "en": "Everything here is old. A bed, a chair and a harmonium."}, {"w": "~", "e": "n", "hi": "दीवार पर बहुत फ़ोटो हैं। हर फ़ोटो में एक लड़की गाती है।", "en": "The wall is covered with photos. In every one, a girl is singing."}, {"w": "~", "e": "n", "hi": "अनीता बिस्तर पर है। उसके गले में एक लाल दुपट्टा है।", "en": "Anita is sitting on the bed. There's a red scarf around her neck."}, {"w": "~", "e": "n", "hi": "और उसके हाथ में... मेरी चिट्ठी।", "en": "And in her hand... my letter."}, {"ch": [{"hi": "वह मेरी चिट्ठी है!", "en": "That's my letter!", "go": "c5angry"}, {"hi": "अनीता जी, आप ठीक हैं?", "en": "Anita ji, are you alright?", "go": "c5kind", "set": "kind"}]}, {"lb": "c5angry"}, {"w": "andy", "e": "ang", "hi": "वह मेरी चिट्ठी है! आप चोर हैं!", "en": "That's my letter! You're a thief!"}, {"w": "anita", "e": "sad", "hi": "हाँ... मैं चोर हूँ। माफ़ कीजिए।", "en": "Yes... I'm a thief. I'm sorry."}, {"w": "anita", "e": "sad", "hi": "लेकिन मेरी बात सुनिए।", "en": "But please, hear me out."}, {"go": "c5story"}, {"lb": "c5kind"}, {"w": "anita", "e": "sur", "hi": "आप गुस्सा नहीं हैं? मैं आपकी चिट्ठी लेती हूँ...", "en": "You're not angry? I took your letter..."}, {"w": "andy", "e": "s", "hi": "थोड़ा गुस्सा हूँ। लेकिन आप रोती हैं। क्या बात है?", "en": "A little angry. But you're crying. What's wrong?"}, {"lb": "c5story"}, {"w": "anita", "e": "sad", "hi": "यह चिट्ठी... यह मेरी माँ की चिट्ठी है।", "en": "This letter... it's my mother's letter."}, {"w": "andy", "e": "sur", "hi": "आपकी माँ की?", "en": "Your mother's?"}, {"w": "anita", "e": "sad", "hi": "मेरी माँ का नाम लता है।", "en": "My mother's name is Lata."}, {"w": "~", "e": "n", "hi": "लता! मीरा जी की छोटी बहन!", "en": "Lata! Meera ji's little sister!"}, {"w": "anita", "e": "n", "hi": "मैं लंदन में बड़ी होती हूँ। माँ हमेशा इस होटल की बात करती थीं।", "en": "I grew up in London. Mum was always talking about this hotel."}, {"w": "anita", "e": "s", "hi": "पहाड़, बादल, रहीम चाचा की रोटी... और उनकी बड़ी बहन, मीरा।", "en": "The mountains, the clouds, Rahim Chacha's roti... and her big sister, Meera."}, {"w": "anita", "e": "sad", "hi": "लेकिन माँ कभी वापस नहीं आतीं। वह डरती थीं।", "en": "But Mum never came back. She was scared."}, {"w": "anita", "e": "sad", "hi": "पिछले साल माँ... अब माँ नहीं हैं।", "en": "Last year, Mum... she's gone now."}, {"w": "andy", "e": "sad", "hi": "ओह, अनीता जी। मुझे बहुत दुख है।", "en": "Oh, Anita ji. I'm so sorry."}, {"w": "anita", "e": "n", "hi": "फिर मैं उनकी किताबें एक दुकान को देती हूँ। बहुत किताबें थीं।", "en": "Then I gave her books to a shop. There were so many books."}, {"w": "andy", "e": "sur", "hi": "लंदन में? एक पुरानी किताबों की दुकान?", "en": "In London? An old bookshop?"}, {"w": "anita", "e": "sur", "hi": "हाँ! आप कैसे जानते हैं?", "en": "Yes! How do you know?"}, {"w": "andy", "e": "h", "hi": "क्योंकि वहाँ मुझे यह चिट्ठी मिलती है! एक किताब के अंदर!", "en": "Because that's where I found this letter! Inside a book!"}, {"w": "anita", "e": "sur", "hi": "क्या?!", "en": "What?!"}, {"w": "~", "e": "n", "hi": "हम दोनों चुप हैं। बाहर बारिश है।", "en": "We're both silent. Outside, the rain."}, {"if": "told", "go": "c5t"}, {"w": "anita", "e": "n", "hi": "खाने से पहले मैं बाहर थी। मैं खिड़की से देखती हूँ: आपके हाथ में चिट्ठी है।", "en": "Before dinner I was outside. Through the window I saw the letter in your hand."}, {"w": "anita", "e": "wor", "hi": "और मैं माँ की लिखाई देखती हूँ!", "en": "And I saw my mum's handwriting!"}, {"go": "c5t2"}, {"lb": "c5t"}, {"w": "anita", "e": "wor", "hi": "खाने पर आप \"लता\" कहते हैं, और मेरा चम्मच गिरता है।", "en": "At dinner you said \"Lata\", and I dropped my spoon."}, {"lb": "c5t2"}, {"w": "anita", "e": "sad", "hi": "फिर बिजली जाती है, और... मैं चिट्ठी लेती हूँ। माफ़ कीजिए।", "en": "Then the power went out, and... I took the letter. I'm sorry."}, {"w": "anita", "e": "n", "hi": "फिर मैं रसोई से कमरा सात की चाबी लेती हूँ। मुझे माँ का कमरा देखना था।", "en": "Then I took the room seven key from the kitchen. I had to see Mum's room."}, {"w": "andy", "e": "th", "hi": "शाम को इस खिड़की में एक रोशनी थी। वह आप थीं?", "en": "This evening there was a light in this window. Was that you?"}, {"w": "anita", "e": "sur", "hi": "नहीं। मैं अभी आती हूँ, पहली बार।", "en": "No. I only just came in, for the first time."}, {"w": "~", "e": "n", "hi": "तो शाम को यहाँ कौन था?", "en": "Then who was in here this evening?"}, {"w": "anita", "e": "n", "hi": "एंडी जी, यह चिट्ठी लीजिए। यह आपकी है।", "en": "Andy ji, take the letter. It's yours."}, {"ch": [{"hi": "नहीं, यह आपकी माँ की है। आप रखिए।", "en": "No, it's your mother's. You keep it.", "go": "c5give", "set": "gave"}, {"hi": "धन्यवाद। हम इसे साथ में पढ़ते हैं।", "en": "Thank you. Let's read it together.", "go": "c5read"}]}, {"lb": "c5give"}, {"w": "anita", "e": "sur", "hi": "सच में? धन्यवाद, एंडी जी!", "en": "Really? Thank you, Andy ji!"}, {"w": "anita", "e": "h", "hi": "लेकिन आप मेरे साथ पढ़िए। मेरी हिंदी भी थोड़ी थोड़ी है!", "en": "But read it with me. My Hindi is only a little bit too!"}, {"go": "c5letter"}, {"lb": "c5read"}, {"w": "anita", "e": "s", "hi": "हाँ। साथ में।", "en": "Yes. Together."}, {"lb": "c5letter"}, {"w": "~", "e": "n", "hi": "हम चिट्ठी खोलते हैं।", "en": "We open the letter."}, {"end": 1}]}, {"id": "c6", "title": "लता की चिट्ठी", "titleEn": "Lata's Letter", "lines": [{"scene": "room7"}, {"show": ["letter"]}, {"w": "letter", "e": "n", "hi": "मीरा दीदी,", "en": "Meera Didi,"}, {"w": "letter", "e": "n", "hi": "आज लंदन में बारिश है। मुझे घर की बारिश याद आती है।", "en": "It's raining in London today. It makes me miss the rain at home."}, {"w": "letter", "e": "n", "hi": "पहाड़ की बारिश, हमारे होटल की बारिश।", "en": "Mountain rain. Our hotel's rain."}, {"w": "letter", "e": "n", "hi": "दीदी, मुझे माफ़ कीजिए।", "en": "Didi, please forgive me."}, {"w": "letter", "e": "n", "hi": "उस रात मैं कुछ नहीं कहती, बस जाती हूँ। यह मेरी गलती है।", "en": "That night I said nothing, I just left. That was my mistake."}, {"w": "letter", "e": "n", "hi": "मैं लंदन में गाती हूँ। लोग मेरा गाना सुनते हैं।", "en": "I sing in London. People listen to my songs."}, {"w": "letter", "e": "n", "hi": "लेकिन हर रात मैं अपना कमरा याद करती हूँ। कमरा सात।", "en": "But every night I think of my room. Room seven."}, {"w": "letter", "e": "n", "hi": "मेरी खिड़की, मेरा हारमोनियम, और आप।", "en": "My window, my harmonium, and you."}, {"w": "letter", "e": "n", "hi": "अब मेरी एक बेटी है। उसका नाम अनीता है।", "en": "I have a daughter now. Her name is Anita."}, {"show": ["letter", "anita"]}, {"w": "anita", "e": "sad", "hi": "...मेरा नाम।", "en": "...My name."}, {"w": "letter", "e": "n", "hi": "वह बहुत फ़ोटो लेती है। वह आपकी तरह सब कुछ देखती है।", "en": "She takes lots of photos. Like you, she notices everything."}, {"w": "letter", "e": "n", "hi": "दीदी, मैं घर आना चाहती हूँ। लेकिन मुझे डर लगता है।", "en": "Didi, I want to come home. But I'm afraid."}, {"w": "letter", "e": "n", "hi": "अगर आप मुझे माफ़ करती हैं, तो कमरा सात की खिड़की में एक मोमबत्ती रखिए।", "en": "If you forgive me, put a candle in the window of room seven."}, {"w": "letter", "e": "n", "hi": "तब मैं घर आती हूँ।", "en": "Then I'll come home."}, {"w": "letter", "e": "n", "hi": "आपकी छोटी बहन, लता।", "en": "Your little sister, Lata."}, {"show": ["anita"]}, {"w": "~", "e": "n", "hi": "हम दोनों चुप हैं।", "en": "Neither of us speaks."}, {"w": "~", "e": "n", "hi": "एक मोमबत्ती... खिड़की में।", "en": "A candle... in the window."}, {"w": "~", "e": "n", "hi": "और शाम को, इसी खिड़की में मैं एक रोशनी देखता हूँ!", "en": "And this evening, I saw a light in this very window!"}, {"w": "anita", "e": "sur", "hi": "क्या? सच में?", "en": "What? Really?"}, {"w": "andy", "e": "sur", "hi": "हाँ! मेरे कमरे से। एक छोटी सी रोशनी।", "en": "Yes! From my room. A tiny light."}, {"w": "anita", "e": "th", "hi": "लेकिन माँ यह चिट्ठी कभी नहीं भेजतीं। चिट्ठी किताब में थी।", "en": "But Mum never sent this letter. It was inside a book."}, {"w": "anita", "e": "th", "hi": "तो मीरा मौसी कैसे जानती हैं?", "en": "So how could Aunt Meera know?"}, {"w": "~", "e": "n", "hi": "हम खिड़की के पास जाते हैं।", "en": "We go over to the window."}, {"cut": "candles"}, {"w": "~", "e": "n", "hi": "खिड़की में एक मोमबत्ती है। बहुत छोटी।", "en": "There's a candle in the window. Burnt very low."}, {"w": "~", "e": "n", "hi": "और खिड़की के नीचे बहुत पुरानी मोमबत्तियाँ हैं।", "en": "And under the window, lots of old candles."}, {"w": "anita", "e": "sad", "hi": "हर रात... एक मोमबत्ती।", "en": "Every night... a candle."}, {"w": "andy", "e": "sad", "hi": "तीस साल। हर रात।", "en": "Thirty years. Every night."}, {"uncut": 1}, {"w": "~", "e": "n", "hi": "फिर दरवाज़े पर एक आवाज़!", "en": "Then, a sound at the door!"}, {"show": ["meera", "anita"]}, {"w": "meera", "e": "ang", "hi": "कौन है मेरे... लता के कमरे में?!", "en": "Who's in my... in Lata's room?!"}, {"end": 1}]}, {"id": "c7", "title": "दो बहनें", "titleEn": "Two Sisters", "lines": [{"scene": "room7"}, {"show": ["meera", "anita"]}, {"w": "meera", "e": "ang", "hi": "आप! और आप! आप यहाँ क्या करते हैं?", "en": "You! And you! What are you doing in here?"}, {"w": "meera", "e": "ang", "hi": "यह कमरा बंद है!", "en": "This room is closed!"}, {"ch": [{"hi": "मीरा जी, यह अनीता है। लता की बेटी।", "en": "Meera ji, this is Anita. Lata's daughter.", "go": "c7direct"}, {"hi": "मीरा जी, पहले यह चिट्ठी पढ़िए।", "en": "Meera ji, read this letter first.", "go": "c7letter", "set": "read"}, {"hi": "अनीता जी, आप बताइए।", "en": "Anita ji, you tell her.", "go": "c7anita"}]}, {"lb": "c7direct"}, {"w": "meera", "e": "sur", "hi": "लता की... बेटी?", "en": "Lata's... daughter?"}, {"go": "c7meet"}, {"lb": "c7letter"}, {"w": "~", "e": "n", "hi": "मीरा जी चिट्ठी लेती हैं। उनके हाथ काँपते हैं।", "en": "Meera ji takes the letter. Her hands are shaking."}, {"w": "meera", "e": "sad", "hi": "यह... लता की लिखाई है।", "en": "This is... Lata's handwriting."}, {"w": "~", "e": "n", "hi": "वह पढ़ती हैं। धीरे धीरे। फिर वह अनीता को देखती हैं।", "en": "She reads. Slowly. Then she looks at Anita."}, {"go": "c7meet"}, {"lb": "c7anita"}, {"w": "anita", "e": "wor", "hi": "मौसी... मैं अनीता हूँ। लता मेरी माँ हैं।", "en": "Auntie... I'm Anita. Lata is my mother."}, {"lb": "c7meet"}, {"w": "meera", "e": "sur", "hi": "तुम... तुम लता की बेटी हो?", "en": "You... you're Lata's daughter?"}, {"w": "anita", "e": "sad", "hi": "हाँ, मौसी।", "en": "Yes, Auntie."}, {"w": "meera", "e": "th", "hi": "हाँ... तुम्हारी आँखें। लता की आँखें।", "en": "Yes... your eyes. Lata's eyes."}, {"w": "meera", "e": "wor", "hi": "लता कहाँ है? वह भी यहाँ है?", "en": "Where's Lata? Is she here too?"}, {"w": "anita", "e": "sad", "hi": "नहीं, मौसी। माँ... पिछले साल...", "en": "No, Auntie. Mum... last year..."}, {"w": "~", "e": "n", "hi": "मीरा जी बिस्तर पर बैठती हैं। वह कुछ नहीं कहतीं।", "en": "Meera ji sits down on the bed. She doesn't say a word."}, {"w": "~", "e": "n", "hi": "बाहर बारिश है। अंदर सब चुप है।", "en": "Outside, the rain. Inside, silence."}, {"w": "meera", "e": "sad", "hi": "तीस साल... तीस साल मैं इंतज़ार करती हूँ।", "en": "Thirty years... thirty years I've waited."}, {"w": "meera", "e": "sad", "hi": "हर रात मैं इस खिड़की में एक मोमबत्ती रखती हूँ।", "en": "Every night I put a candle in this window."}, {"w": "andy", "e": "sur", "hi": "तो वह आप थीं! शाम की रोशनी!", "en": "So that was you! The light this evening!"}, {"w": "meera", "e": "sad", "hi": "हाँ। लता को घर का रास्ता दिखाने के लिए।", "en": "Yes. To show Lata the way home."}, {"w": "anita", "e": "sad", "hi": "मौसी... माँ की चिट्ठी पढ़िए।", "en": "Auntie... read Mum's letter."}, {"if": "read", "go": "c7skip"}, {"w": "~", "e": "n", "hi": "मीरा जी चिट्ठी पढ़ती हैं। धीरे धीरे।", "en": "Meera ji reads the letter. Slowly."}, {"lb": "c7skip"}, {"w": "meera", "e": "sad", "hi": "\"अगर आप मुझे माफ़ करती हैं, तो कमरा सात की खिड़की में एक मोमबत्ती रखिए।\"", "en": "\"If you forgive me, put a candle in the window of room se   ? { no: [`Tu n'as pas ${t[0]}.`, `You don't have ${t[1]}.`], buy: [`Tu achètes ${t[0]}.`, `You buy ${t[1]}.`], poor: ["Tu n'as pas assez d'argent.", "You don't have enough money."] }[k]
  : { no: [`आपके पास ${t[0]} नहीं है।`, `You don't have ${t[1]}.`], buy: [`आप ${t[0]} खरीदते हैं।`, `You buy ${t[1]}.`], poor: ["आपके पास पैसे नहीं हैं।", "You don't have enough money."] }[k]; };

function advStart(id) {

      if (!o.go) return stay(o.msg || advLine("buy", o.buy));

// Asks Claude for stories (structured JSON), checks them, and asks for fixes up to twice. Every call is logged in the spend ledger.
async function aiStories(system, prompt, kind, check, fixing, fixText, schema) {
  const Anthropic = await loadAnthropic();
  const client = new Anthropic({ apiKey: aiKey, dangerouslyAllowBrowser: true });
  const messages = [{ role: "user", content: prompt }], runId = Date.now().toString(36);
  let res = null, chk = null;
  for (let round = 0; round < 3; round++) {
    const stream = client.beta.messages.stream({
      model: AI_MODEL, max_tokens: 64000, system, messages,
      betas: ["server-side-fallback-2026-07-01"], fallbacks: "default",
      output_config: { effort: "high", format: { type: "json_schema", schema: schema || RMX_SCHEMA } }
    });
    const msg = await stream.finalMessage();
    aiRecord(msg, kind + ":" + runId);
    if (msg.stop_reason === "refusal") throw new Error("Claude declined to write these stories.");
    if (msg.stop_reason === "max_tokens") throw new Error("The stories came out too long. Try fewer.");
    res = JSON.parse(msg.content.filter(b => b.type === "text").map(b => b.text).join(""));
    chk = check(res);
    const note = fixing(chk);
    if (!note || round === 2) break;
    rmxSay(note);
    messages.push({ role: "assistant", content: msg.content });
    messages.push({ role: "user", content: fixText(chk) });
  }
  return { res, chk };
}
function aiErrText(e) {
  const A = window.Anthropic;
  return A && e instanceof A.AuthenticationError ? "Claude didn't accept the API key. Check it in Settings."
    : A && e instanceof A.PermissionDeniedError ? "This API key isn't allowed to use Claude. Check the key in the Claude Console."
    : A && e instanceof A.RateLimitError ? "Claude is busy right now. Wait a minute and try again."
    : A && e instanceof A.BadRequestError && /credit|billing|balance/i.test(e.message) ? "Your API credit has run out. Add some in the Claude Console → Billing."
    : A && e instanceof A.APIConnectionError ? "Couldn't reach Claude. Check the internet connection."
    : A && e instanceof A.APIError ? "Claude had a problem: " + (e.message || e.status)
    : e instanceof SyntaxError ? "Claude's answer came back garbled. Nothing was changed. Try again."
    : (e && e.message) || "Something went wrong.";
}

async function rmxSave(res, pick) {
  const oldIds = pick.map(L => L.id);
  const nums = lessons.map(L => /^n(\d+)$/.exec(L.id)).filter(Boolean).map(m => +m[1]);
  let next = (nums.length ? Math.max(...nums) : 0) + 1;
  const keep = lessons.filter(L => !oldIds.includes(L.id));
  const minOrder = Math.min(0, ...keep.map(L => L.order ?? 0)), maxOrder = Math.max(0, ...keep.map(L => L.order ?? 0));
  const modelGloss = {}; for (const g of res.gloss || []) if (g && g.w) modelGloss[norm(g.w)] = g;
  const made = res.stories.map((st, i) => {
    const gloss = {};
    const sentences = st.sentences.map(s => ({ p: Math.max(0, s.p | 0), hi: String(s.text).trim(), en: String(s.en).trim() }));
    for (const s of sentences) for (const m of s.hi.match(WORD_RE) || []) {
      const w = norm(m); if (gloss[w]) continue;
      const g0 = glossFor(w), e = V[w], mg = modelGloss[w];
      if (g0) gloss[w] = g0;
      else if (e && e.m) gloss[w] = e.t ? { m: e.m, t: e.t } : { m: e.m };
      else if (mg) gloss[w] = mg.t ? { m: mg.m, t: mg.t } : { m: mg.m };
      if (gloss[w] && mg && mg.c && mg.c !== "name" && !gloss[w].c && !WORD_TYPE_MAP[w]) gloss[w] = Object.assign({}, gloss[w], { c: mg.c });   // word type, for Progress
    }
    const id = "n" + String(next++).padStart(2, "0");
    // brand-new words (never seen, not names): these stories go to the bottom, after the ones that only have learning words left
    const fresh = new Set(); for (const s of sentences) for (const m of s.hi.match(WORD_RE) || []) { const w = norm(m); if (statusOf(w) === 0 && !isNameWord(w) && !isNameGloss(gloss[w])) fresh.add(w); }
    return { id, fresh: fresh.size, doc: { order: 0, title: st.title, titleEn: st.titleEn, topic: st.topic, level: "Beginner", summary: st.summary,
      createdAt: Date.now() + i, ...(oldIds.length ? { remixOf: oldIds } : {}), ...(st.kind ? { kind: st.kind } : {}), ...(st.targets ? { targets: st.targets } : {}), sentences, gloss } };
  });
  const top = made.filter(x => !x.fresh), bottom = made.filter(x => x.fresh).sort((a, b) => a.fresh - b.fresh);
  top.forEach((x, i) => { x.doc.order = minOrder - top.length + i; });
  bottom.forEach((x, i) => { x.doc.order = maxOrder + 1 + i; });
  if (gh) {
    const branch = gh.branch || "main", msg = `${oldIds.length ? "Remix " + oldIds.join(" ") : "New stories"} → ${made.map(x => x.id).join(" ")}${NATIVE ? " (Thor)" : " (browser)"}`;
    for (const x of made) {
      const r = await ghApi("/contents/" + GH_ROOT + "lessons/" + x.id + ".json", { method: "PUT", body: { message: msg, content: b64e(JSON.stringify(x.doc, null, 1)), branch } });
      ghSha[GH_ROOT + "lessons/" + x.id + ".json"] = r.content.sha;
    }
    for (const id of oldIds) {
      const file = GH_ROOT + "lessons/" + id + ".json";
      try { const c = await ghApi("/contents/" + file + "?ref=" + branch); await ghApi("/contents/" + file, { method: "DELETE", body: { message: msg, sha: c.sha, branch } }); }
      catch (e) { if (e.status !== 404) throw e; }
      delete ghSha[file]; delete ghPend["lessons/" + id];
    }
    store.set("ghsha", ghSha); store.set("ghpend", ghPend);
  }
  lessons = keep.concat(made.map(x => Object.assign({ id: x.id }, x.doc)));
  ghSaveLocal();
}
