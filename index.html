const VN_CSS = `

  if (n > 1 && end.c && end.v === "a" && !end.n) { end.v = ""; end.dropped = true; }
  for (let i = n - 2; i >= 1; i--) {
    const x = out[i], pv = out[i - 1], nx = out[i + 1];
    if (x.c && x.v === "a" && !x.n && pv.v !== "" && nx.c && nx.v !== "") { x.v = ""; x.dropped = true; i--; }
  }
  const letter = g => ABC_BY_G[g] || ABC_BY_G[g.normalize("NFC")] || ABC_BY_G[g.normalize("NFD")];
  const signName = sg => {
    if (sg === "्") return "no vowel";
    if (sg === "ं") return "nasal n / m";
    if (sg === "ँ") return "through the nose";
    if (sg === "ः") return "breathy h";
    const v = ABC_VOWELS.find(v => v.m === sg); return v ? v.r : "";
  };
  return out.map(x => {
    const L = letter(x.base);
    return {
      text: x.text.normalize("NFC"),
      roman: x.r + x.v + (x.n === "ं" || x.n === "ँ" ? "n" : x.n === "ः" ? "h" : ""),
      say: (x.text + (x.dropped ? "्" : "")).normalize("NFC"),
      base: x.base.normalize("NFC"), baseR: L ? L.r : x.r,
      signs: x.signs.map(sg => ({ s: sg, name: signName(sg) })),
      dropped: !!x.dropped
    };
  });
}
function firstWordK(si) { const el = $(`#story .w[data-si="${si}"]`); return el ? +el.dataset.k : -1; }
function gotoSentence(si) {
  const L = currentLesson(); if (!L) return;
  si = Math.max(0, Math.min(L.sentences.length - 1, si));
  const el = $(`#story .w[data-si="${si}"]`); if (!el) return;
  stopPlayer(); player.si = si;
  saveMeaning(); selectWord(el); autoLearnSel();
  el.scrollIntoView({ block: "center", behavior: "smooth" });
  if (settings.sentMode) { highlightSentence(si); speak(L.sentences[si].hi, { onend: () => highlightSentence(-1) }); }
  else speak(el.dataset.w);
}
function toggleSentMode() {
  settings.sentMode = !settings.sentMode; saveSettings();
  toast(settings.sentMode ? "Sentence mode on: ▲ ▼ play the whole sentence" : "Sentence mode off: ▲ ▼ say the first word");
}
function highlightSentence(si) {
  $$(".sent.playing").forEach(e => e.classList.remove("playing"));
  const el = si >= 0 && $(`.sent[data-si="${si}"]`); if (el) { el.classList.add("playing"); el.scrollIntoView({ block: "center", behavior: "smooth" }); }
}
function goPrevLesson() {
  const cur = currentLesson(), list = cur && cur.book ? bookChapters(cur.book) : storyLessons(); const i = list.findIndex(l => l.id === route.lesson);
  if (i > 0) { saveMeaning(); stopPlayer(); player.si = 0; go("reader", { lesson: list[i - 1].id }); } else toast("This is the first story.");
}
render();

(async () => {
  if (STANDALONE) {
    dbState = "ok"; showBanner(""); render();
    if (gh) ghPull();
    else if (SITE && !lessons.length) showBanner("Connect your GitHub data repo in Settings to load your stories and words.");
    return;
  }
  const c = window.claude;
  if (!c || typeof c.use !== "function") { dbState = "off"; showBanner("Showing the copy saved on this device. Open the app from its claude.ai link to sync."); render(); return; }
  c.use("sample").then(s => { sample = s; if (route.view === "reader" && sel) renderPanel(); }).catch(() => {});
  try { db = await c.use("db"); } catch { db = null; }
  if (!db) { dbState = "off"; showBanner("Not connected. You're seeing the copy saved on this device. Changes will sync next time you're signed in."); render(); return; }
  dbState = "ok"; showBanner("");
  const fail = err => { if (err && err.code === "revoked") { dbState = "off"; updateSync(); } };
  db.collection("lessons").onSnapshot(onLessons, fail);
  db.collection("vocab").onSnapshot(onVocab, fail);
  db.doc("stats/activity").onSnapshot(onActivity, fail);
  db.doc("game/state").onSnapshot(snap => {
    gameState = snap.exists ? snap.data() : { coins: 0, quests: {}, facts: "" };
    store.set("game", gameState);
    if (route.view === "talk") { updateHud(); game.nearDirty = true; if (!talk.npc) renderSide(); }
  }, fail);
  db.doc("alphabet/progress").onSnapshot(snap => {
    abcProg = snap.exists ? snap.data() : { k: {} };
    if (!abcProg.k) abcProg.k = {};
    store.set("abc", abcProg);
    if (route.view === "alphabet" && !(abcState.quiz && abcState.quiz.picked == null)) render();
  }, fail);
  render();
  flush();
})();
})();
</script>
